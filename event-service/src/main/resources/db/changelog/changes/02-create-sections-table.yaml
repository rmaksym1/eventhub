databaseChangeLog:
  - changeSet:
      id: create-sections-table
      author: rmaksym1
      changes:
        - createTable:
            tableName: sections
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: venue_id
                  type: bigint
                  constraints:
                    nullable: false
                    references: venues(id)
                    foreignKeyName: fk_sections_venue
