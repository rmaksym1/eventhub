databaseChangeLog:
  - changeSet:
      id: create-venues-table
      author: rmaksym1
      changes:
        - createTable:
            tableName: venues
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
