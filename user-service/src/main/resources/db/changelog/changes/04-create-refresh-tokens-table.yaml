databaseChangeLog:
  - changeSet:
      author: rmaksym1
      id: create-refresh-tokens-table
      changes:
        - createTable:
            tableName: refresh_tokens
            columns:
              - column:
                  name: id
                  autoIncrement: true
                  type: bigint
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: token
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: username
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: expiry_date
                  type: timestamp(6)
                  constraints:
                    nullable: false