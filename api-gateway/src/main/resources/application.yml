server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://user-service:8080
              predicates:
                - Path=/api/users/**, /api/auth/**, /v3/api-docs/user-service
              filters:
                - RewritePath=/v3/api-docs/user-service, /api/v3/api-docs

            - id: event-service
              uri: http://event-service:8080
              predicates:
                - Path=/api/events/**, /v3/api-docs/event-service
              filters:
                - RewritePath=/v3/api-docs/event-service, /v3/api-docs

            - id: reservation-service
              uri: http://reservation-service:8080
              predicates:
                - Path=/api/reservations/**, /v3/api-docs/reservation-service
              filters:
                - RewritePath=/v3/api-docs/reservation-service, /v3/api-docs

springdoc:
  swagger-ui:
    urls:
      - name: User Service
        url: /v3/api-docs/user-service
      - name: Event Service
        url: /v3/api-docs/event-service
      - name: Reservation Service
        url: /v3/api-docs/reservation-service